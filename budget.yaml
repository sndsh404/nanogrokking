# What each preset costs, measured on real hardware. No estimates.
#
# Two machines are tracked. All preset numbers below are from the Windows
# laptop; your numbers will differ, and these are a floor from genuinely
# modest hardware.

machines:
  windows_laptop:
    cpu: "Intel Core 5 120U (low-power laptop cpu, 12 threads)"
    ram: "16 GB"
    gpu: none
    stack: "Windows 11, Python 3.14, torch 2.10.0+cpu"
    note: "every measured_runtime_seconds and peak_memory_mb below is from this machine"
  github_ci_ubuntu:
    machine: "GitHub Actions ubuntu-latest runner (2 cpu threads per torch)"
    stack: "Ubuntu, Python 3.12, torch 2.10.0"
    tiny_measured_runtime_seconds: 2.6
    note: "measured by the ci workflow's `time` step on push ed25814; CI runs the tiny preset and the test suite only, fast and paper are never re-trained in CI"

presets:
  tiny:
    p: 7
    params: 8896
    steps: 30
    measured_runtime_seconds: 1
    peak_memory_mb: 200
    purpose: "ci smoke test; proves the code runs, does not need to grok"

  fast:
    p: 53
    params: 121728
    steps: 6000
    measured_runtime_seconds: 284
    peak_memory_mb: 325
    purpose: "the default experience; full grokking curve in under 5 minutes"
    notes: "memorizes by step 150, generalizes at step 3150"

  paper:
    p: 113
    params: 226816
    steps: 40000
    measured_runtime_seconds: 12446
    peak_memory_mb: 458
    purpose: "the exact configuration from arXiv:2301.05217 section 3"
    notes: "this is an overnight-class run on a weak cpu; the committed log in runs/paper/ is the precomputed artifact"
